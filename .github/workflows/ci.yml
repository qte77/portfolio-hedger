name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # SHA-pinned: the repo's Actions policy requires full-length commit SHAs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Lint, test, QuantLib cross-check, build
        run: make validate

  # The headless UI check (scripts/e2e.py) on the built dist/, served from disk. Non-blocking while it proves stable
  # in CI; locally `make e2e` stays the gate for UI changes.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    env:
      E2E_PY: uv run --no-project --with patchright==1.63.0 python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Chromium for patchright
        run: uv run --no-project --with patchright==1.63.0 patchright install --with-deps chromium
      - name: Build and run the UI check on dist/
        run: make build e2e E2E_PY="$E2E_PY"
